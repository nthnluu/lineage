<style>
/* Layout: app shell. 56px toolbar; Explore = path bar + Miller columns + inspector; Index = filter bar + virtualized register. Monochrome UI, category hue is the only color. */
:root {
  --bg: #ffffff;
  --bg-2: #fafafa;
  --bg-3: #f2f2f3;
  --line: #ebebeb;
  --line-2: #dcdcde;
  --fg: #0a0a0a;
  --fg-2: #5b5b61;
  --fg-3: #9b9ba1;
  --link: #0060df;
  --sel: #0a0a0a;
  --sel-fg: #ffffff;
  --scrim: rgb(0 0 0 / .28);
  --shadow-pop: 0 0 0 1px rgb(0 0 0 / .06), 0 16px 48px -8px rgb(0 0 0 / .22);
  --shadow-1: 0 1px 2px rgb(0 0 0 / .05);
  --cat-l: .62; --cat-c: .17;
  --sans: "Geist", -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
  --mono: "Geist Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --ease: cubic-bezier(.2, .8, .2, 1);
  --col-w: 284px;
  --insp-w: 440px;
  --pad-l: max(16px, env(safe-area-inset-left, 0px));
  --pad-r: max(16px, env(safe-area-inset-right, 0px));
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0a0a0a; --bg-2: #111112; --bg-3: #1b1b1d; --line: #222224; --line-2: #333336;
    --fg: #ededed; --fg-2: #a1a1a6; --fg-3: #6e6e74; --link: #52a8ff; --sel: #ededed; --sel-fg: #0a0a0a;
    --scrim: rgb(0 0 0 / .6); --shadow-pop: 0 0 0 1px rgb(255 255 255 / .08), 0 16px 48px -8px rgb(0 0 0 / .7); --shadow-1: none;
    --cat-l: .72; --cat-c: .16; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0a0a0a; --bg-2: #111112; --bg-3: #1b1b1d; --line: #222224; --line-2: #333336;
  --fg: #ededed; --fg-2: #a1a1a6; --fg-3: #6e6e74; --link: #52a8ff; --sel: #ededed; --sel-fg: #0a0a0a;
  --scrim: rgb(0 0 0 / .6); --shadow-pop: 0 0 0 1px rgb(255 255 255 / .08), 0 16px 48px -8px rgb(0 0 0 / .7); --shadow-1: none;
  --cat-l: .72; --cat-c: .16; color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--fg); font: 14px/1.45 var(--sans);
  -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility;
  display: flex; flex-direction: column; overflow: hidden;
}
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
a { color: var(--link); text-decoration: none; }
a:hover { text-decoration: underline; }
:focus-visible { outline: 2px solid var(--link); outline-offset: 1px; border-radius: 6px; }
.num { font-family: var(--mono); font-variant-numeric: tabular-nums; letter-spacing: -.01em; }
.dot { width: 8px; height: 8px; border-radius: 50%; flex: none; background: oklch(var(--cat-l) var(--cat-c) var(--h)); }
.kbd { font: 500 11px/1 var(--mono); color: var(--fg-3); border: 1px solid var(--line-2); border-radius: 5px; padding: 3px 5px; background: var(--bg); }
.icon { width: 16px; height: 16px; flex: none; }
::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-thumb { background: var(--line-2); border-radius: 10px; border: 3px solid transparent; background-clip: content-box; }
::-webkit-scrollbar-track { background: transparent; }

/* ---------- toolbar ---------- */
.bar {
  flex: none; height: 56px; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 12px;
  padding-left: var(--pad-l); padding-right: var(--pad-r); border-bottom: 1px solid var(--line); background: var(--bg);
}
.brand { display: flex; align-items: center; gap: 10px; min-width: 0; border: 0; background: none; padding: 0; text-align: left; }
.brand svg { flex: none; }
.brand b { font-weight: 600; font-size: 15px; letter-spacing: -.015em; white-space: nowrap; }
.brand span { color: var(--fg-3); font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.seg { display: inline-flex; padding: 3px; gap: 2px; border-radius: 9px; background: var(--bg-3); }
.seg button { border: 0; background: none; padding: 5px 14px; border-radius: 7px; font-weight: 500; font-size: 13px; color: var(--fg-2); transition: color .15s, background .15s; }
.seg button[aria-selected="true"] { background: var(--bg); color: var(--fg); box-shadow: var(--shadow-1), 0 0 0 1px var(--line); }
.bar-r { display: flex; justify-content: flex-end; gap: 8px; min-width: 0; }
.search-btn {
  display: flex; align-items: center; gap: 8px; width: min(300px, 100%); height: 34px; padding: 0 6px 0 10px;
  border: 1px solid var(--line); border-radius: 8px; background: var(--bg-2); color: var(--fg-3); text-align: left; transition: border-color .15s;
}
.search-btn:hover { border-color: var(--line-2); }
.search-btn .t { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 13px; }
.ibtn { width: 34px; height: 34px; display: grid; place-items: center; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); color: var(--fg-2); flex: none; }
.ibtn:hover { color: var(--fg); border-color: var(--line-2); }

main { flex: 1; min-height: 0; display: flex; }
.view { flex: 1; min-width: 0; display: flex; }

/* ---------- explore ---------- */
.browser { flex: 1; min-width: 0; display: flex; flex-direction: column; background: var(--bg-2); }
.pathbar {
  flex: none; height: 40px; display: flex; align-items: center; gap: 2px; overflow-x: auto; scrollbar-width: none;
  padding-left: var(--pad-l); padding-right: var(--pad-r); border-bottom: 1px solid var(--line); background: var(--bg); font-size: 13px; white-space: nowrap;
}
.pathbar::-webkit-scrollbar { display: none; }
.pathbar button { border: 0; background: none; padding: 4px 6px; border-radius: 6px; color: var(--fg-2); }
.pathbar button:hover { background: var(--bg-3); color: var(--fg); }
.pathbar button:last-child { color: var(--fg); font-weight: 500; }
.pathbar .sep { color: var(--fg-3); }
.cols { flex: 1; min-height: 0; display: flex; overflow-x: auto; overflow-y: hidden; overscroll-behavior-x: contain; }
.col { flex: none; width: var(--col-w); display: flex; flex-direction: column; border-right: 1px solid var(--line); min-height: 0; background: var(--bg); }
.col.enter { animation: colIn .22s var(--ease); }
@keyframes colIn { from { transform: translateX(-10px); opacity: .4; } }
.col-h { flex: none; padding: 12px 14px 8px; display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
.col-h .l { font-size: 11px; font-weight: 500; text-transform: uppercase; letter-spacing: .06em; color: var(--fg-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.col-h .c { font: 500 11px var(--mono); color: var(--fg-3); }
.col-list { flex: 1; overflow-y: auto; padding: 0 6px 12px; overscroll-behavior: contain; }
.it {
  display: flex; align-items: center; gap: 10px; width: 100%; height: 34px; padding: 0 8px 0 10px; border: 0; border-radius: 7px;
  background: none; text-align: left; color: var(--fg); transition: background .08s;
}
.it:hover { background: var(--bg-3); }
.it .nm { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.it .yr { font: 12px var(--mono); color: var(--fg-3); font-variant-numeric: tabular-nums; }
.it .chev { width: 12px; color: var(--fg-3); flex: none; opacity: 0; }
.it.has .chev { opacity: 1; }
.it.path { background: var(--bg-3); font-weight: 500; }
.it.sel { background: var(--sel); color: var(--sel-fg); font-weight: 500; }
.it.sel .yr, .it.sel .chev { color: var(--sel-fg); opacity: .7; }
.it:focus-visible { outline-offset: -2px; }
.grp { padding: 14px 10px 4px; font-size: 11px; font-weight: 500; color: var(--fg-3); letter-spacing: .02em; }
.col-empty { padding: 10px 14px; color: var(--fg-3); font-size: 13px; }
.col-pad { flex: 1; min-width: 40px; }

/* ---------- inspector ---------- */
.insp { flex: none; width: var(--insp-w); border-left: 1px solid var(--line); background: var(--bg); overflow-y: auto; overscroll-behavior: contain; }
.card { padding: 28px 28px 56px; display: flex; flex-direction: column; gap: 22px; }
.card.fade { animation: fade .2s var(--ease); }
@keyframes fade { from { opacity: .3; transform: translateY(3px); } }
.pill { display: inline-flex; align-items: center; gap: 7px; height: 24px; padding: 0 10px; border-radius: 999px; border: 1px solid var(--line); font-size: 12px; color: var(--fg-2); font-weight: 500; background: var(--bg); }
.pill.btn:hover { border-color: var(--line-2); color: var(--fg); }
.meta-row { display: flex; gap: 6px; flex-wrap: wrap; }
.card h1 { margin: 12px 0 0; font-size: 32px; line-height: 1.1; font-weight: 600; letter-spacing: -.028em; text-wrap: balance; }
.card .when { margin-top: 8px; font: 500 14px var(--mono); color: var(--fg-2); font-variant-numeric: tabular-nums; }
.card .lede { margin: 0; font-size: 15.5px; line-height: 1.6; color: var(--fg-2); max-width: 60ch; text-wrap: pretty; }
.actions { display: flex; gap: 8px; flex-wrap: wrap; }
.btn-p, .btn-s { display: inline-flex; align-items: center; gap: 8px; height: 36px; padding: 0 14px; border-radius: 8px; font-weight: 500; font-size: 13.5px; text-decoration: none !important; border: 1px solid transparent; }
.btn-p { background: var(--sel); color: var(--sel-fg); }
.btn-p:hover { opacity: .88; }
.btn-s { background: var(--bg); color: var(--fg); border-color: var(--line); }
.btn-s:hover { border-color: var(--line-2); background: var(--bg-2); }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); border: 1px solid var(--line); border-radius: 12px; }
.stats > div { padding: 12px 14px; }
.stats > div + div { border-left: 1px solid var(--line); }
.stats b { display: block; font: 500 20px var(--mono); letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
.stats span { font-size: 12px; color: var(--fg-3); }
.sec { display: flex; flex-direction: column; gap: 10px; }
.sec-h { display: flex; align-items: baseline; justify-content: space-between; font-size: 12px; font-weight: 500; color: var(--fg-3); text-transform: uppercase; letter-spacing: .06em; }
.sec-h .c { font: 500 11px var(--mono); text-transform: none; letter-spacing: 0; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip {
  display: inline-flex; align-items: center; gap: 7px; height: 28px; max-width: 100%; padding: 0 10px 0 9px; border-radius: 8px;
  border: 1px solid var(--line); background: var(--bg); font-size: 13px; transition: border-color .12s, background .12s;
}
.chip:hover { border-color: var(--line-2); background: var(--bg-2); }
.chip .cn { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.chip .cy { font: 11.5px var(--mono); color: var(--fg-3); }
.more { border: 0; background: none; color: var(--link); padding: 0 6px; height: 28px; font-size: 13px; }
.muted { color: var(--fg-3); font-size: 13px; }
.rows { display: none; flex-direction: column; border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
.rows button { display: flex; align-items: center; gap: 12px; min-height: 48px; padding: 8px 14px; border: 0; background: var(--bg); text-align: left; }
.rows button + button { border-top: 1px solid var(--line); }
.rows button:active { background: var(--bg-3); }
.rows .nm { flex: 1; min-width: 0; font-size: 15px; }
.rows .yr { font: 12.5px var(--mono); color: var(--fg-3); }
.rows .sub { display: block; font-size: 12px; color: var(--fg-3); }

/* time ribbon + lineage */
.ribbon { position: relative; height: 44px; margin-top: 2px; }
.ribbon .band { position: absolute; top: 0; height: 20px; border-radius: 3px; background: var(--bg-3); }
.ribbon .band:nth-child(even) { background: var(--bg-2); }
.ribbon .mk { position: absolute; top: -2px; width: 2px; height: 24px; margin-left: -1px; border-radius: 2px; background: var(--fg-3); opacity: .55; }
.ribbon .mk.now { background: var(--fg); opacity: 1; width: 3px; margin-left: -1.5px; }
.ribbon .tk { position: absolute; top: 26px; font: 10.5px var(--mono); color: var(--fg-3); transform: translateX(-50%); white-space: nowrap; }
.lin { list-style: none; margin: 0; padding: 0; }
.lin li { display: grid; grid-template-columns: 78px 20px 1fr; align-items: center; min-height: 30px; }
.lin .y { font: 12px var(--mono); color: var(--fg-3); text-align: right; padding-right: 4px; font-variant-numeric: tabular-nums; }
.lin .r { position: relative; align-self: stretch; display: grid; place-items: center; }
.lin .r::before { content: ""; position: absolute; top: 0; bottom: 0; left: 50%; width: 1px; background: var(--line-2); }
.lin li:first-child .r::before { top: 50%; }
.lin li:last-child .r::before { bottom: 50%; }
.lin .r .dot { position: relative; box-shadow: 0 0 0 3px var(--bg); }
.lin button { border: 0; background: none; padding: 4px 6px; text-align: left; border-radius: 6px; font-size: 13.5px; color: var(--fg); justify-self: start; }
.lin button:hover { background: var(--bg-3); }
.lin li.here button { font-weight: 600; }

/* welcome */
.hello { padding: 36px 28px 56px; display: flex; flex-direction: column; gap: 26px; }
.hello h1 { margin: 0; font-size: 34px; line-height: 1.08; font-weight: 600; letter-spacing: -.032em; text-wrap: balance; }
.hello p { margin: 0; color: var(--fg-2); font-size: 15.5px; line-height: 1.6; text-wrap: pretty; }
.kpis { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.kpis div { border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; }
.kpis b { display: block; font: 500 22px var(--mono); letter-spacing: -.03em; }
.kpis span { font-size: 12px; color: var(--fg-3); }
.cats { display: grid; grid-template-columns: 1fr 1fr; gap: 2px 12px; }
.cats button { display: flex; align-items: center; gap: 9px; border: 0; background: none; padding: 6px 8px; border-radius: 7px; text-align: left; font-size: 13px; }
.cats button:hover { background: var(--bg-3); }
.cats .n { margin-left: auto; font: 11.5px var(--mono); color: var(--fg-3); }

/* ---------- index ---------- */
.reg { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.tools { flex: none; display: flex; flex-direction: column; gap: 10px; padding: 12px var(--pad-r) 12px var(--pad-l); border-bottom: 1px solid var(--line); }
.tools-row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.field { display: flex; align-items: center; gap: 8px; height: 32px; padding: 0 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); color: var(--fg-3); }
.field:focus-within { border-color: var(--line-2); box-shadow: 0 0 0 3px var(--bg-3); }
.field input { border: 0; outline: 0; background: none; width: 220px; color: var(--fg); font-size: 13px; }
.field input::placeholder { color: var(--fg-3); }
.sel-wrap { position: relative; }
.sel-wrap select { appearance: none; height: 32px; padding: 0 28px 0 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); font-size: 13px; color: var(--fg); }
.sel-wrap svg { position: absolute; right: 9px; top: 50%; translate: 0 -50%; pointer-events: none; color: var(--fg-3); }
.count { margin-left: auto; font: 12px var(--mono); color: var(--fg-3); }
.catbar { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; margin-left: calc(-1 * var(--pad-l)); margin-right: calc(-1 * var(--pad-r)); padding-left: var(--pad-l); padding-right: var(--pad-r); }
.catbar::-webkit-scrollbar { display: none; }
.ct { display: inline-flex; align-items: center; gap: 7px; flex: none; height: 28px; padding: 0 10px; border-radius: 999px; border: 1px solid var(--line); background: var(--bg); font-size: 12.5px; color: var(--fg-2); transition: all .12s; }
.ct:hover { border-color: var(--line-2); }
.ct .n { font: 11px var(--mono); color: var(--fg-3); }
.ct[aria-pressed="true"] { background: var(--sel); color: var(--sel-fg); border-color: var(--sel); }
.ct[aria-pressed="true"] .n { color: var(--sel-fg); opacity: .7; }
.thead, .vrow { display: grid; grid-template-columns: 112px minmax(180px, 1.1fr) 190px minmax(0, 2fr) 72px 32px; gap: 16px; align-items: center; padding-left: var(--pad-l); padding-right: var(--pad-r); }
.thead { flex: none; height: 34px; font-size: 11px; font-weight: 500; text-transform: uppercase; letter-spacing: .06em; color: var(--fg-3); border-bottom: 1px solid var(--line); background: var(--bg-2); }
.thead .r, .vrow .r { text-align: right; }
.vlist { flex: 1; overflow-y: auto; position: relative; overscroll-behavior: contain; contain: strict; }
.vspace { position: relative; width: 100%; }
.vrow { position: absolute; left: 0; right: 0; height: 44px; border-bottom: 1px solid var(--line); cursor: pointer; }
.vrow:hover { background: var(--bg-2); }
.vrow .y { font: 12.5px var(--mono); color: var(--fg-3); text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
.vrow .n { font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.vrow .f { display: flex; align-items: center; gap: 8px; color: var(--fg-2); font-size: 13px; overflow: hidden; white-space: nowrap; }
.vrow .d { color: var(--fg-2); font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.vrow .l { font: 12.5px var(--mono); color: var(--fg-3); text-align: right; }
.vrow .w { display: grid; place-items: center; width: 28px; height: 28px; border-radius: 6px; color: var(--fg-3); }
.vrow .w:hover { background: var(--bg-3); color: var(--fg); text-decoration: none; }
.vgrp { position: absolute; left: 0; right: 0; height: 40px; display: flex; align-items: flex-end; gap: 10px; padding: 0 var(--pad-r) 8px var(--pad-l); border-bottom: 1px solid var(--line); background: var(--bg); font-size: 12px; font-weight: 600; color: var(--fg); }
.vgrp span { font: 11.5px var(--mono); color: var(--fg-3); font-weight: 400; }
.vempty { padding: 40px var(--pad-r) 40px var(--pad-l); color: var(--fg-3); }

/* ---------- palette ---------- */
.scrim { position: fixed; inset: 0; z-index: 50; background: var(--scrim); display: flex; justify-content: center; align-items: flex-start; padding: max(10vh, env(safe-area-inset-top, 0px)) var(--pad-r) 16px var(--pad-l); animation: scrimIn .14s ease-out; }
@keyframes scrimIn { from { opacity: 0; } }
.pal { width: min(640px, 100%); max-height: min(560px, 76vh); display: flex; flex-direction: column; border-radius: 14px; background: var(--bg); box-shadow: var(--shadow-pop); overflow: hidden; animation: palIn .18s var(--ease); }
@keyframes palIn { from { transform: scale(.98) translateY(-4px); opacity: 0; } }
.pal-in { display: flex; align-items: center; gap: 10px; padding: 0 16px; height: 54px; border-bottom: 1px solid var(--line); color: var(--fg-3); }
.pal-in input { flex: 1; min-width: 0; border: 0; outline: 0; background: none; font-size: 16px; color: var(--fg); }
.pal-in input::placeholder { color: var(--fg-3); }
.pal-list { flex: 1; overflow-y: auto; padding: 6px; }
.pal-h { padding: 8px 10px 4px; font-size: 11.5px; font-weight: 500; color: var(--fg-3); }
.pal-it { display: flex; align-items: center; gap: 12px; width: 100%; min-height: 42px; padding: 6px 10px; border: 0; border-radius: 8px; background: none; text-align: left; }
.pal-it[aria-selected="true"] { background: var(--bg-3); }
.pal-it .tx { flex: 1; min-width: 0; }
.pal-it .nm { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pal-it .sub { display: block; font-size: 12px; color: var(--fg-3); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pal-it .yr { font: 12px var(--mono); color: var(--fg-3); }

const reels = new Set();
function startReels() {
  document.querySelectorAll(".land.reel").forEach(root => {

    const posterOnly = saveData;

      v.dataset.start = s.start; v.dataset.end = s.end; v.dataset.fallback = CLOUDINARY ? "1" : "";

    };

      const n = byId.get(clip.id), name = root.querySelector(".reel-name"), cr = root.querySelector(".reel-credit");
      name.dataset.id = clip.id; name.textContent = n ? `${n.name}, ${yr(n.year)} →` : "";
      cr.href = clip.page; cr.textContent = clip.credit + (clip.license ? ` · ${clip.license}` : "");
    };

      v.addEventListener("loadedmetadata", () => { v.currentTime = +v.dataset.start; v.playbackRate = 0.75; });
      v.addEventListener("timeupdate", () => { if (v.currentTime > +v.dataset.end) v.currentTime = +v.dataset.start; });

        else { // Cloudinary failed: stream the original from Wikimedia instead (MP4 rendition)

        }

    <div class="sec"><div class="sec-h">Required <span class="c">${n.req.length}</span></div>${n.req.length ? chips(n.req, 14, "r" + n.id) : `<div class="muted">A starting point. Nothing in the index comes before it.</div>`}${suggestLink("connection", { title: `Connection: → ${n.name}`, to: n.id }, "Suggest a missing prerequisite")}</div>
    ${lin.length > 1 ? `<div class="sec"><div class="sec-h">Longest chain back <span class="c">${lin.length - 1} steps</span></div>${ribbon(lin, n)}
      <ol class="lin">${lin.map(x => `<li class="${x === n ? "here" : ""}"><span class="y">${yr(x.year)}</span><span class="r">${dot(x)}</span><button data-id="${x.id}">${esc(x.name)}</button></li>`).join("")}</ol></div>` : ""}
    <p class="fixline">Something wrong here? ${suggestLink("correction", { title: `Fix: ${n.name}`, tech: n.id }, "Suggest a correction")}</p>
  </article>`;
  el.scrollTop = 0;
}

$("#cols").addEventListener("click", e => {
  const gt2 = e.target.closest("[data-go-tab]"); if (gt2) { const v = gt2.dataset.goTab; if (v === "explore") go(roots[0], { col: 0 }); else setTab(v); return; }
  if (e.target.closest("[data-shuffle]")) { pickRound++; const g = $("#cols .picks.big"); if (g) g.innerHTML = pickCards(pickSet(12)); return; }
  const gt = e.target.closest("[data-go-tab]"); if (gt) { const v = gt.dataset.goTab; if (v === "explore") { go(roots[0], { col: 0 }); } else setTab(v); return; }
  const lc = e.target.closest(".reel-name, .sug, .root"); if (lc && lc.dataset.id) { go(byId.get(lc.dataset.id)); return; }
  const pk = e.target.closest(".pick"); if (pk) { go(byId.get(pk.dataset.id)); return; } const b = e.target.closest(".it"); if (b) go(byId.get(b.dataset.id), { col: +b.dataset.col, focus: { col: +b.dataset.col } }); });
$("#insp").addEventListener("click", e => {
  if (e.target.closest("[data-shuffle]")) { pickRound++; const y = $("#insp").scrollTop; renderInsp(null); $("#insp").scrollTop = y; $("#insp .card")?.classList.remove("fade"); return; }
  const m = e.target.closest("[data-more]"); if (m) { expanded.add(m.dataset.more); const y = $("#insp").scrollTop; renderInsp(path[path.length - 1]); $("#insp").scrollTop = y; $("#insp .card").classList.remove("fade"); return; }
  const c = e.target.closest("[data-cat]"); if (c) { catOn.clear(); catOn.add(c.dataset.cat); syncCats(); setTab("index"); return; }
  const ix = e.target.closest("[data-index]"); if (ix) { showInIndex(byId.get(ix.dataset.index)); return; }
  const gx = e.target.closest("[data-graph]"); if (gx) { setTab("graph"); return; }
  const b = e.target.closest("[data-id]"); if (b) go(byId.get(b.dataset.id));
});
$("#pathbar").addEventListener("click", e => { const b = e.target.closest("[data-crumb]"); if (!b) return; const i = +b.dataset.crumb; i < 0 ? go(null) : go(path[i]); });
$("#home").addEventListener("click", () => { setTab("explore"); go(null); });
$("#random").addEventListener("click", () => { openNode(N[Math.floor(Math.random() * N.length)]); });

// keyboard navigation of columns
document.addEventListener("keydown", e => {
  if ($("#explore").hidden || scrimEl || e.metaKey || e.ctrlKey || e.altKey) return;
  if (/INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName)) return;
  const k = Math.max(path.length - 1, 0);
  if (e.key === "ArrowDown" || e.key === "ArrowUp" || e.key === "j" || e.key === "k") {
    e.preventDefault();
    const list = listFor(k), cur = path[k];
    const i = cur ? list.indexOf(cur) : -1;
    const nx = list[Math.min(Math.max(i + (e.key === "ArrowDown" || e.key === "j" ? 1 : -1), 0), list.length - 1)];
    if (nx) go(nx, { col: k, focus: { col: k } });
  } else if (e.key === "ArrowRight" || e.key === "l") {
    const cur = path[path.length - 1];
    if (!cur) { e.preventDefault(); go(roots[0], { col: 0, focus: { col: 0 } }); }
    else if (cur.kids.length) { e.preventDefault(); go(cur.kids[0], { col: path.length, focus: { col: path.length } }); }
  } else if ((e.key === "ArrowLeft" || e.key === "h") && path.length > 1) {
    e.preventDefault(); path.pop(); go(path[path.length - 1], { col: path.length - 1, focus: { col: path.length - 1 } });
  } else if (e.key === "Enter" && path.length) {
    window.open(wikiUrl(path[path.length - 1].wiki), "_blank", "noopener");
  } else if (e.key === "r") { $("#random").click(); }
});

/* ---------- search ---------- */
const norm = s => s.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "");
for (const n of N) { n._n = norm(n.name); n._w = norm(n.wiki); n._d = norm(n.desc); }
function search(q, limit = 50) {
  q = norm(q.trim()); if (!q) return [];
  const words = q.split(/\s+/);
  const out = [];
  for (const n of N) {
    let s = 0;
    if (n._n === q || n._w === q) s = 1000;
    else if (n._n.startsWith(q)) s = 800;
    else if (n._n.includes(" " + q) || n._n.includes("-" + q) || n._n.includes("(" + q)) s = 600;
    else if (n._n.includes(q)) s = 500;
    else if (n._w.includes(q)) s = 400;
    else if (words.length > 1 && words.every(w => n._n.includes(w))) s = 350;
    else if (words.every(w => n._d.includes(w) || n._n.includes(w))) s = 150;
    if (s) out.push([s + Math.min(n.nDes, 900) / 10, n]);
  }
  out.sort((a, b) => b[0] - a[0]);
  return out.slice(0, limit).map(x => x[1]);
}
const hl = (name, q) => { const i = norm(name).indexOf(norm(q.trim())); if (!q.trim() || i < 0) return esc(name); const L = q.trim().length; return esc(name.slice(0, i)) + "<mark>" + esc(name.slice(i, i + L)) + "</mark>" + esc(name.slice(i + L)); };
let recent = (store.get("tt-recent") || "").split(",").filter(id => byId.has(id));
let scrimEl = null, palHits = [], palSel = 0, lastFocus = null;
function openPalette(initial = "") {
  if (scrimEl) return;
  lastFocus = document.activeElement;
  scrimEl = document.createElement("div");
  scrimEl.className = "scrim";
  scrimEl.innerHTML = `<div class="pal" role="dialog" aria-modal="true" aria-label="Search technologies">
    <div class="pal-in"><svg class="icon" viewBox="0 0 16 16" fill="none" aria-hidden="true"><circle cx="7" cy="7" r="4.75" stroke="currentColor" stroke-width="1.5"/><path d="m10.5 10.5 3 3" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
    <input id="pal-q" placeholder="Search technologies, e.g. transistor, aqueduct, CRISPR" autocomplete="off" spellcheck="false" role="combobox" aria-controls="pal-list" aria-expanded="true"><span class="kbd">esc</span></div>
    <div class="pal-list" id="pal-list" role="listbox"></div>
    <div class="pal-f"><span><span class="kbd">↑</span><span class="kbd">↓</span>move</span><span><span class="kbd">↵</span>open</span><span><span class="kbd">${isMac ? "⌘" : "Ctrl"}</span><span class="kbd">↵</span>open on Wikipedia</span></div>
  </div>`;
  document.body.appendChild(scrimEl);
  const cb = $("#open-search").getBoundingClientRect(), pal = scrimEl.querySelector(".pal");
  if (cb.width) { scrimEl.classList.add("dock"); Object.assign(pal.style, { left: cb.left + "px", width: cb.width + "px", bottom: (innerHeight - cb.bottom) + "px" }); }
  const docked = scrimEl.classList.contains("dock");
  const q = scrimEl.querySelector("#pal-q");
  q.value = initial;
  const update = () => { palHits = q.value.trim() ? search(q.value) : (recent.length ? recent.map(id => byId.get(id)) : [...N].sort((a, b) => b.nDes - a.nDes).slice(0, 8)); palSel = 0; renderPal(q.value); };
  q.addEventListener("input", update);
  q.addEventListener("keydown", e => {
    if (e.key === "ArrowDown" || e.key === "ArrowUp") { e.preventDefault(); const up = (e.key === "ArrowUp") === docked; palSel = up ? Math.min(palSel + 1, palHits.length - 1) : Math.max(palSel - 1, 0); renderPal(q.value, true); }
    else if (e.key === "Enter") { e.preventDefault(); const n = palHits[palSel]; if (!n) return; if (e.metaKey || e.ctrlKey) window.open(wikiUrl(n.wiki), "_blank", "noopener"); else { closePalette(); openNode(n); } }
    else if (e.key === "Escape") { e.preventDefault(); closePalette(); }
    else if (e.key === "Tab") e.preventDefault();
  });
  scrimEl.addEventListener("mousedown", e => { if (e.target === scrimEl) closePalette(); });
  scrimEl.querySelector("#pal-list").addEventListener("click", e => { const b = e.target.closest("[data-id]"); if (b) { closePalette(); openNode(byId.get(b.dataset.id)); } });
  scrimEl.querySelector("#pal-list").addEventListener("mousemove", e => { const b = e.target.closest("[data-i]"); if (b && +b.dataset.i !== palSel) { palSel = +b.dataset.i; renderPal(q.value, true); } });
  update();
  q.focus();
}
function renderPal(qv, moveOnly) {
  const L = scrimEl.querySelector("#pal-list");
  if (moveOnly) { L.querySelectorAll("[data-i]").forEach(b => b.setAttribute("aria-selected", +b.dataset.i === palSel)); const s = L.querySelector('[aria-selected="true"]'); s && s.scrollIntoView({ block: "nearest" }); return; }
  if (!palHits.length) { L.innerHTML = `<div class="pal-empty">No technology matches “${esc(qv.trim())}”. Try a broader word, or ${suggestLink("new-technology", { title: `Add: ${qv.trim()}`, name: qv.trim() }, "suggest adding it")}.</div>`; return; }
  const head = qv.trim() ? "" : `<div class="pal-h">${recent.length ? "Recent" : "Most built upon"}</div>`;
  const items = palHits.map((n, i) => `<button class="pal-it" role="option" data-i="${i}" data-id="${n.id}" aria-selected="${i === palSel}">${thumb(n)}<span class="tx"><span class="nm">${hl(n.name, qv)}</span><span class="sub">${CATS[n.cat][0]} · ${esc(n.desc)}</span></span><span class="yr">${yr(n.year)}</span></button>`).join("");
  L.innerHTML = scrimEl.classList.contains("dock") ? items + head : head + items;
}
window.addEventListener("resize", () => { if (scrimEl && scrimEl.classList.contains("dock")) closePalette(); });
function closePalette() { if (!scrimEl) return; scrimEl.remove(); scrimEl = null; lastFocus && lastFocus.focus && lastFocus.focus({ preventScroll: true }); }
$("#open-search").addEventListener("click", () => openPalette());
document.addEventListener("keydown", e => {
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "k") { e.preventDefault(); scrimEl ? closePalette() : openPalette(); return; }
  if (scrimEl) return;
  if (/INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName) || e.metaKey || e.ctrlKey || e.altKey) return;
  if (e.key === "/") { e.preventDefault(); openPalette(); }
  else if (e.key === "1" || e.key === "2" || e.key === "3") { e.preventDefault(); setTab(["explore", "graph", "index"][+e.key - 1]); }
});

/* ---------- tabs ---------- */
let tab = "explore";
function setTab(t) {
  tab = t;
  document.querySelectorAll("[data-tab]").forEach(b => b.setAttribute("aria-selected", b.dataset.tab === t));
  $("#explore").hidden = t !== "explore";
  $("#index").hidden = t !== "index";
  $("#graph").hidden = t !== "graph";
  if (t === "index") { renderIndex(true); revealInIndex(path[path.length - 1]); }
  if (t === "graph") graphShow(path[path.length - 1]);
  store.set("tt-tab", t);
}
document.querySelectorAll("[data-tab]").forEach(b => b.addEventListener("click", () => setTab(b.dataset.tab)));

/* ---------- index (virtualized) ---------- */
const catOn = new Set();
{
  const cc = {}; for (const n of N) cc[n.cat] = (cc[n.cat] || 0) + 1;
  $("#catbar").innerHTML = `<button class="ct" data-all aria-pressed="true">All fields<span class="n">${fmt(N.length)}</span></button>` + Object.entries(CATS).filter(([k]) => cc[k]).map(([k, [nm, h]]) => `<button class="ct" data-c="${k}" aria-pressed="false"><span class="dot" style="--h:${h}"></span>${nm}<span class="n">${cc[k]}</span></button>`).join("");
  $("#f-era").innerHTML = `<option value="">All eras</option>` + ERAS.map((e, i) => `<option value="${i}">${e[1]}</option>`).join("");
}
function syncCats() { document.querySelectorAll("#catbar [data-c]").forEach(b => b.setAttribute("aria-pressed", catOn.has(b.dataset.c))); $("#catbar [data-all]").setAttribute("aria-pressed", !catOn.size); }
$("#catbar").addEventListener("click", e => {
  const b = e.target.closest(".ct"); if (!b) return;
  if (b.hasAttribute("data-all")) catOn.clear(); else { const k = b.dataset.c; catOn.has(k) ? catOn.delete(k) : catOn.add(k); }
  syncCats(); renderIndex();
});
["#f-era", "#f-sort"].forEach(s => $(s).addEventListener("change", renderIndex));
let ft; $("#f-text").addEventListener("input", () => { clearTimeout(ft); ft = setTimeout(renderIndex, 60); });

let VI = [], VO = [], VH = 0;
const RH = () => matchMedia("(max-width: 760px)").matches ? 60 : 44, GH = 40;
function renderIndex(keepScroll) {
  const era = $("#f-era").value, sort = $("#f-sort").value, t = norm($("#f-text").value.trim());
  const list = N.filter(n => (!catOn.size || catOn.has(n.cat)) && (era === "" || n.era === +era) && (!t || n._n.includes(t) || n._d.includes(t) || n._w.includes(t)));
  const cmp = { year: byYear, "-year": (a, b) => byYear(b, a), name: (a, b) => a.name.localeCompare(b.name), "-des": (a, b) => b.nDes - a.nDes || byYear(a, b) }[sort];
  list.sort(cmp);
  $("#f-count").textContent = `${fmt(list.length)} of ${fmt(N.length)}`;
  const grouped = sort === "year" || sort === "-year";
  const counts = {}; if (grouped) for (const n of list) counts[n.era] = (counts[n.era] || 0) + 1;
  VI = []; VO = []; let y = 0, last = -1; const rh = RH();
  for (const n of list) {
    if (grouped && n.era !== last) { VI.push({ g: n.era }); VO.push(y); y += GH; last = n.era; }
    VI.push(n); VO.push(y); y += rh;
  }
  VH = y;
  $("#vspace").style.height = Math.max(VH, 1) + "px";
  if (!keepScroll) $("#vlist").scrollTop = 0;
  lastRange = "";
  paintIndex(counts);
}
let lastRange = "", gcounts = {};
function paintIndex(counts) {
  if (counts) gcounts = counts;
  const v = $("#vlist"), top = v.scrollTop, bot = top + v.clientHeight;
  if (!VI.length) { $("#vspace").innerHTML = `<div class="vempty">No technologies match these filters. Clear the filter or choose another era.</div>`; return; }
  let lo = 0, hi = VO.length - 1;
  while (lo < hi) { const m = (lo + hi + 1) >> 1; if (VO[m] <= top) lo = m; else hi = m - 1; }
  const start = Math.max(0, lo - 8);
  let end = lo; while (end < VI.length && VO[end] < bot) end++;
  end = Math.min(VI.length, end + 12);
  const key = start + ":" + end; if (key === lastRange) return; lastRange = key;
  const rh = RH();
  let h = "";
  for (let i = start; i < end; i++) {
    const it = VI[i];
    if (it.g != null) { h += `<div class="vgrp" style="top:${VO[i]}px">${ERAS[it.g][1]}<span>${fmt(gcounts[it.g] || 0)}</span></div>`; continue; }
    const n = it;
    h += `<div class="vrow${n === path[path.length - 1] ? " cur" : ""}" role="button" tabindex="0" data-id="${n.id}" style="top:${VO[i]}px;height:${rh}px"><span class="y">${fmtYear(n.year).replace("c. ", "")}</span><span class="n">${esc(n.name)}</span><span class="f">${dot(n)}${CATS[n.cat][0]}</span><span class="d">${esc(n.desc)}</span><span class="l">${n.nDes ? fmt(n.nDes) : "–"}</span><a class="w" href="${wikiUrl(n.wiki)}" target="_blank" rel="noopener" title="Open “${esc(n.wiki)}” on Wikipedia" aria-label="Open on Wikipedia">${ICON_EXT}</a></div>`;
  }
  $("#vspace").innerHTML = h;
}
let raf = 0; $("#vlist").addEventListener("scroll", () => { if (!raf) raf = requestAnimationFrame(() => { raf = 0; paintIndex(); }); }, { passive: true });
window.addEventListener("resize", () => { if (tab === "index") renderIndex(true); });
$("#vlist").addEventListener("click", e => { if (e.target.closest("a")) return; const r = e.target.closest(".vrow"); if (r) { setTab("explore"); go(byId.get(r.dataset.id)); } });
$("#vlist").addEventListener("keydown", e => { if (e.key === "Enter") { const r = e.target.closest(".vrow"); if (r) { setTab("explore"); go(byId.get(r.dataset.id)); } } });
// scroll the index to the selected technology; if the filters hide it, clear them first
function revealInIndex(n, force) {
  if (!n) return;
  if (VI.indexOf(n) < 0 && force) { catOn.clear(); syncCats(); $("#f-era").value = ""; $("#f-text").value = ""; renderIndex(true); }
  const i = VI.indexOf(n); if (i < 0) return;
  const v = $("#vlist"), top = VO[i];
  if (top < v.scrollTop || top > v.scrollTop + v.clientHeight - 60) v.scrollTop = Math.max(0, top - v.clientHeight / 3);
  lastRange = ""; paintIndex();
}
function showInIndex(n) { setTab("index"); revealInIndex(n, true); }

/*GRAPHJS*//* ---------- boot ---------- */
{
  const h = decodeURIComponent(location.hash.slice(1));
  const start = byId.get(h);
  setTab(start ? (store.get("tt-tab") === "graph" ? "graph" : "explore") : (["index", "graph"].includes(store.get("tt-tab")) ? store.get("tt-tab") : "explore"));
  go(start || null);
}
window.addEventListener("hashchange", () => { const n = byId.get(location.hash.slice(1)); if (n && path[path.length - 1] !== n) openNode(n); });
</script>
